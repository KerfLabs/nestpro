name: Public check

# Runs on every push, docs included: docs are where customer names and e-mail
# addresses are most likely to slip in. It takes seconds. The rule and
# feature IDs and the line endings are checked here too (tools/check.sh runs
# the same scripts locally).
on:
  push:
    branches-ignore: [cla-signatures]
  pull_request:

jobs:
  public-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The line endings are compared with where the branch left its
          # base, so the history and the base branch are needed.
          fetch-depth: 0
      - name: No research evidence, shop data or unreviewed images
        run: tools/public-check.sh
      - name: Rule and feature IDs used once each
        run: tools/unique-ids.sh
      - name: Line endings kept as committed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          tools/line-endings-test.sh
          if [ -n "$BASE_REF" ]; then tools/line-endings.sh "origin/$BASE_REF"; else tools/line-endings.sh; fi
