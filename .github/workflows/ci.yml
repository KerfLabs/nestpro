name: CI

# The Linux and Windows test builds. Docs-only changes skip them; the public
# check (public-check.yml) still runs on those. FEATURES.md is compiled into
# the tests, so a change to it does run them. Later patterns override earlier ones.
on:
  push:
    # The CLA bot's signature list lives on its own branch; nothing to test there.
    branches-ignore: [cla-signatures]
    paths:
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!docs/**'
      - '!.github/workflows/cla.yml'
      - '!.github/workflows/public-check.yml'
      - 'FEATURES.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!docs/**'
      - '!.github/workflows/cla.yml'
      - '!.github/workflows/public-check.yml'
      - 'FEATURES.md'

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Tests
        working-directory: app
        run: cargo test --locked

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (GTK for file dialogs, X11/GL for egui)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Tests
        working-directory: app
        run: cargo test --locked
