name: CLA

# Asks first-time contributors to accept CLA.md on their pull request and records
# who has signed in signatures/cla.json on the cla-signatures branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      # Pinned to the v2.6.1 commit. This job never checks out pull request code.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/KurfLabs/nestpro/blob/main/CLA.md
          branch: cla-signatures
          allowlist: Trillx,bot*
